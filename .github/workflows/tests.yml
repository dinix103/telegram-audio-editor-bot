name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: audio
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: audio
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U audio" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.lock && pip install -e '.[test]'
      - run: ruff check .
      - run: pytest -q
        env:
          TEST_REDIS_URL: redis://localhost:6379/15
          TEST_DATABASE_URL: postgresql://audio:ci-test-password@localhost/audio
      - name: Validate compose
        run: |
          cp .env.example .env
          TELEGRAM_API_ID=12345 TELEGRAM_API_HASH=test docker compose config --quiet
      - name: Build application container
        run: docker build -t audio-editor-test .
      - name: Import application in container
        run: docker run --rm audio-editor-test python -c 'import audio_bot.bot, audio_bot.workers, audio_bot.cleanup'
  bot-api-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/telegram-api.Dockerfile -t local-bot-api-test .
      - name: Verify executable and runtime libraries
        run: docker run --rm --entrypoint telegram-bot-api local-bot-api-test --help
