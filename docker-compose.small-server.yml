# Limited mode for a shared 2 GB VPS. Not suitable for the specification's 2 GB files.
# Load the deployment images first, then use up --no-build --pull never.
services:
  telegram-bot-api:
    image: audio-editor-bot-api:deploy
    mem_limit: 256m
    cpus: 0.5
  bot:
    image: audio-editor:deploy
    mem_limit: 160m
    environment: &limits
      MAX_INPUT_BYTES: '25000000'
      MAX_OUTPUT_BYTES: '50000000'
      JOB_QUOTA_BYTES: '150000000'
      DISK_RESERVE_BYTES: '300000000'
      OPERATION_TIMEOUT: '600'
  audio-worker:
    image: audio-editor:deploy
    mem_limit: 384m
    cpus: 0.75
    environment: *limits
  cleanup-worker:
    image: audio-editor:deploy
    mem_limit: 96m
    environment: *limits
  redis:
    mem_limit: 64m
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 32mb, --maxmemory-policy, noeviction]
  postgres:
    mem_limit: 192m
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=40]
